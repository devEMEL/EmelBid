specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EmelBid
    network: sepolia
    source:
      address: "0xCf8B3FEAb3d90fbA7DFfc92CDdE3984eE91A8516"
      abi: EmelBid
      startBlock: 10000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Auction
        - Bid
      abis:
        - name: EmelBid
          file: ./abis/EmelBid.json
      eventHandlers:
        - event: AuctionCreated(indexed bytes32,indexed address,address,uint8,uint256,uint256,uint256,uint256,uint256)
          handler: handleAuctionCreated
        - event: AuctionSettled(indexed bytes32,address)
          handler: handleAuctionSettled
        - event: AuctionExpired(indexed bytes32)
          handler: handleAuctionExpired
        - event: DecryptionRequested(indexed uint256,indexed bytes32,address)
          handler: handleDecryptionRequested
        - event: DecryptionFulfilled(indexed uint256,bool)
          handler: handleDecryptionFulfilled
        - event: BidRefunded(indexed bytes32,address)
          handler: handleBidRefunded
        - event: ProceedsClaimed(indexed bytes32)
          handler: handleProceedsClaimed
      file: ./src/mapping.ts
